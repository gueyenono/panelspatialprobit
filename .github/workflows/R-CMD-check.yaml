# Based on the r-lib/actions example workflow (check-standard).
on:
  push:
    branches: [main, master, rust]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # Rust is preinstalled on the runners. R on Windows links with the GNU
      # toolchain, so cargo needs that target. No cargo cache here, so the
      # check builds as CRAN does (target and CARGO_HOME inside the build tree).
      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Rust target for R on Windows
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      # R CMD check warns when an install downloads crates, so the tarball
      # carries them, as a CRAN tarball would.
      - name: Vendor the Rust crates
        run: sh tools/vendor.sh
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
